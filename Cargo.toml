[package]
name = "logistics-system"
version = "0.12.4"
edition = "2024"

[dependencies]
 mysql = "*"
 uuid = { version = "1.24.0", features = ["v4", "serde"] }
 sqlx = { version = "0.8.6" }
 actix-web = "4"
 actix-cors = "0.7"
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"
 tokio = { version = "1", features = ["full"] }
 utoipa = { version = "5", features = ["actix_extras", "uuid"] }
 # `vendored` embeds the Swagger UI assets in the crate; without it the build
 # script downloads them from github.com at compile time, which fails inside
 # the Docker/CI image build.
 utoipa-swagger-ui = { version = "8", features = ["actix-web", "vendored"] }
 jsonwebtoken = "9"
 bcrypt = "0.15"
 reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
 actix-multipart = "0.7"
 futures-util = "0.3"
 sha2 = "0.10"

[dev-dependencies]
 actix-http = "3"

# Lints `cargo clippy -- -D warnings` (.github/workflows/rust-lint.yml) would
# otherwise fail on. These are deliberate style choices in this codebase, not
# bugs: route helpers return `Result<_, HttpResponse>` (actix idiom), domain
# modules mirror their directory name (`vehicle/vehicle.rs`), and a few DB row
# tuples / `from_str` helpers predate the lint. Remove an entry here to start
# enforcing it.
[lints.clippy]
result_large_err = "allow"
module_inception = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
