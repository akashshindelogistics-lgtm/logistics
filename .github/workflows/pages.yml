name: Pages — Swagger UI

# The API docs on GitHub Pages:
#   /            → redirects to /api-docs/
#   /api-docs/   → Swagger UI for this REST API
#
# The dashboard has its own Pages site in logistics-frontend. GitHub Pages must
# be set to "GitHub Actions" as its source once: Repo → Settings → Pages. The
# OpenAPI-spec validation runs as CI on a push to ANY branch, so spec drift is
# caught before a pull request; only main/master deploys.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────
  # Generate + validate the OpenAPI spec (no MySQL needed)
  # ────────────────────────────────────────────────────────
  validate-swagger:
    name: Validate OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate OpenAPI spec JSON
        run: cargo run --bin gen_openapi --release > openapi.json

      - name: Validate OpenAPI JSON is well-formed
        run: |
          python3 -c "
          import json, sys
          spec = json.load(open('openapi.json'))
          paths = spec.get('paths', {})
          print(f'OpenAPI {spec[\"openapi\"]} — {len(paths)} paths')
          expected = [
              '/api/health', '/api/auth/login', '/api/auth/user-login',
              '/api/orgs/{id}/users', '/api/users/{id}',
              '/api/orgs', '/api/orgs/{id}', '/api/orgs/{id}/location',
              '/api/orgs/{id}/vehicles', '/api/orgs/{id}/godowns', '/api/godowns/{gid}',
              '/api/godowns/{gid}/location', '/api/godowns/{gid}/stock',
              '/api/godowns/{gid}/stock/{desc}', '/api/godowns/{gid}/transfer',
              '/api/orgs/{id}/stock-transfers', '/api/orgs/{id}/dispatch',
              '/api/dispatches/{id}/status', '/api/vehicles/{reg}/location',
              '/api/track/{tracker_key}', '/api/vehicles/{reg}/tracker-key/rotate',
              '/api/vehicles/{reg}', '/api/vehicles/{reg}/driver',
              '/api/orgs/{id}/vendors', '/api/vendors/{id}',
              '/api/orgs/{id}/vehicle-hires', '/api/vehicle-hires/{id}/assign',
              '/api/vehicle-hires/{id}/payments',
              '/api/vehicles/{reg}/documents', '/api/vehicle-documents/{id}',
              '/api/orgs/{id}/vehicle-documents',
              '/api/vehicles/{reg}/maintenance', '/api/vehicle-maintenance/{id}',
              '/api/vehicle-maintenance/{id}/mileage', '/api/orgs/{id}/vehicle-maintenance',
              '/api/customers', '/api/orgs/{id}/customers',
              '/api/customers/{id}', '/api/customers/{id}/location',
              '/api/customers/{id}/billing',
              '/api/dispatches/{id}/invoice', '/api/invoices/{id}',
              '/api/invoices/{id}/pay', '/api/orgs/{id}/invoices',
              '/api/orgs/{id}/reports',
              '/api/dispatches/{id}/notifications', '/api/orgs/{id}/notifications',
              '/api/orgs/{id}/trips', '/api/trips/{id}',
              '/api/orgs/{id}/uploads', '/api/uploads/{id}',
              '/api/driver-app/latest', '/api/driver-app/download',
              '/api/drivers/{id}/device-token', '/api/drivers/{id}/device-token/rotate',
          ]
          missing = [p for p in expected if p not in paths]
          if missing:
              print('MISSING paths:', missing, file=sys.stderr); sys.exit(1)
          print('All expected API paths present ✅')
          "

      - name: Upload openapi.json
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 1

  # ────────────────────────────────────────────────────────
  # Assemble the site and deploy
  # ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate-swagger
    # Only the default branches publish to the live site; other branches stop
    # after validate-swagger has run as a CI check.
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: ./site/api-docs

      - name: Add Swagger UI page
        run: |
          cat > ./site/api-docs/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Logistics System API — Swagger UI</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
            <link rel="icon" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
            <style>
              body { font-family: 'Inter', system-ui, sans-serif; background: #0f1117; margin: 0; }
              #header { background: linear-gradient(135deg, #1a1d2e, #0f3460); padding: 24px 32px; }
              #header h1 { color: #fff; font-size: 22px; margin: 0; }
              #header p { color: rgba(255,255,255,0.55); font-size: 13px; margin: 4px 0 0; }
              .swagger-ui .topbar { display: none; }
            </style>
          </head>
          <body>
            <div id="header">
              <h1>🚚 Logistics System API</h1>
              <p>Rust · Actix-Web · MySQL — Interactive REST API Documentation</p>
            </div>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
            <script>
              window.onload = () => SwaggerUIBundle({
                url: './openapi.json',
                dom_id: '#swagger-ui',
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                layout: 'StandaloneLayout',
                deepLinking: true,
                tryItOutEnabled: true,
              });
            </script>
          </body>
          </html>
          HTMLEOF
          # The site root only points at the API docs.
          cat > ./site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Logistics System API</title>
          <meta http-equiv="refresh" content="0; url=api-docs/">
          <a href="api-docs/">Logistics System API docs (Swagger UI)</a>
          HTMLEOF
          # Pages' default Jekyll processing would drop files it considers special; skip it.
          touch ./site/.nojekyll
          find ./site -maxdepth 2 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
