name: Deploy Backend — GHCR + Oracle VM

# Builds the API container, pushes it to GitHub Container Registry, then SSHes
# into the Oracle Cloud "Always Free" VM and rolls out the new image with
# docker compose.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST   public IP or hostname of the Oracle VM
#   SSH_USER   login user (e.g. ubuntu / opc)
#   SSH_KEY    private key (PEM) authorised on the VM
#   SSH_PORT   optional, defaults to 22
#
# One-time on the VM:
#   - install Docker + compose plugin, open ports 80/443 (and the OCI security list)
#   - mkdir ~/logistics-deploy && put a filled-in .env there (see deploy/.env.example)
#   - if the GHCR package is private: `docker login ghcr.io` with a read:packages PAT

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & push image
    # Native arm64 runner (free for public repos). Oracle "Always Free" Ampere
    # VMs are arm64, so we build a single-arch arm64 image here — no QEMU. An
    # earlier multi-arch attempt failed because cross-compiling this crate for
    # arm64 under QEMU emulation crashes rustc (exit 101).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/logistics-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Roll out on Oracle VM
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "logistics-deploy"
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/logistics-deploy
            test -f .env || { echo "Missing ~/logistics-deploy/.env"; exit 1; }
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
            docker compose --env-file .env ps
