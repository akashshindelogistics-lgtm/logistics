name: Deploy Backend (manual)

# Redeploy or roll back the API on the Oracle VM to an image tag that already
# exists in GHCR (published by `release.yml` on a version tag). Building and the
# normal release rollout both live in `release.yml`; this workflow is the
# break-glass "pin the VM to <tag> now" button.
#
# Required repo secrets:  SSH_HOST, SSH_USER, SSH_KEY  (SSH_PORT optional)
#
# One-time on the VM:
#   - Docker + compose plugin installed, ports 80/443 open (host + OCI security list)
#   - mkdir ~/logistics-deploy and put a filled-in .env there (deploy/.env.example)
#   - if the GHCR package is private: `docker login ghcr.io` with a read:packages PAT

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag to deploy (e.g. 0.1.0, 0.1, latest)'
        required: true
        default: 'latest'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out on Oracle VM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile"
          target: "logistics-deploy"
          strip_components: 1

      - name: Pin image tag and roll out
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/logistics-deploy
            test -f .env || { echo "Missing ~/logistics-deploy/.env"; exit 1; }
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            sed -i "s#^API_IMAGE=.*#API_IMAGE=ghcr.io/${OWNER}/logistics-api:${{ github.event.inputs.image_tag }}#" .env
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f
            docker compose --env-file .env ps
