name: Periodic Cargo Tests

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: logistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      # The test build (cfg(test)) connects to `logistics_test` and creates it
      # on demand — see src/logistics/test_support.rs and docs/testing-database.md.
      # DB-touching tests are serialized and truncate every table before each
      # test, so a warm database no longer masks failures.
      - name: Create test database
        run: mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS logistics_test;"

      - name: Run all tests
        run: cargo test --all --verbose
        env:
          # NOTE: the connection args are still hardcoded in source (localhost,
          # root/password). These env vars become live in Phase 2 (DbConfig).
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: logistics_test

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::One or more cargo tests FAILED. Review the output above."
          exit 1
