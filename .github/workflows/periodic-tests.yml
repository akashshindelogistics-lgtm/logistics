name: Periodic Cargo Tests

# The cargo suite runs on a push to ANY branch (not just main/master), so a
# feature branch gets test feedback before (and without) a pull request. The
# pull_request trigger is kept only for forks — a fork can't trigger `push` on
# this repo — and the job below skips the duplicate pull_request run for
# same-repo branches. The 2-hourly schedule is unchanged.
on:
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Run Cargo Tests
    runs-on: ubuntu-latest
    # A same-repo branch is already covered by the push event; only let a
    # pull_request through when it comes from a fork.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: logistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      # The test build (cfg(test)) connects to `logistics_test` and creates it
      # on demand — see src/logistics/test_support.rs and docs/testing-database.md.
      # Every DB-touching test provisions its own logistics_test_<uuid>
      # database via TestDb (Phase 3) and drops it when the test ends, so
      # tests run at full parallelism instead of being serialized against one
      # shared database. This step just seeds the base `logistics_test`
      # database that TestDb's own connection.rs unit tests still target.
      - name: Create test database
        run: mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS logistics_test;"

      - name: Run all tests
        run: cargo test --all --verbose
        env:
          # DbConfig::from_env() (src/logistics/db/connection.rs) reads these
          # directly — see docs/testing-database.md (Phase 2).
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: logistics_test

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::One or more cargo tests FAILED. Review the output above."
          exit 1
