name: Frontend Tests (Unit + Playwright)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test:unit

  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: logistics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust backend ──────────────────────────────────────────────────────────

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build logistics-system backend
        run: cargo build --bin logistics-system --release

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ppassword --silent 2>/dev/null; then
              echo "MySQL is ready ✅"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "::error::MySQL failed to become ready"
          exit 1

      - name: Start backend server
        run: ./target/release/logistics-system &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for backend to be ready
        run: |
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "Backend is ready ✅"
              exit 0
            fi
            echo "Waiting for backend... ($i/20)"
            sleep 1
          done
          echo "::error::Backend failed to start within 20 seconds"
          exit 1

      # ── Node / frontend ───────────────────────────────────────────────────────

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium + system deps)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server
        working-directory: frontend
        run: npm run dev &

      - name: Wait for Vite to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite dev server is ready ✅"
              exit 0
            fi
            echo "Waiting for Vite... ($i/30)"
            sleep 1
          done
          echo "::error::Vite dev server failed to start within 30 seconds"
          exit 1

      # ── Tests ─────────────────────────────────────────────────────────────────

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

      # ── Artifacts ─────────────────────────────────────────────────────────────

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (traces / screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
