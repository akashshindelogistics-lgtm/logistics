name: Swagger UI — Validate & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Grant permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress runs on the same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1: Build binary, generate spec, validate the spec,
  #         start server and smoke-test the Swagger UI endpoint
  # ────────────────────────────────────────────────────────
  validate-swagger:
    name: Validate Swagger UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Build the main binary (needed to start the server)
      - name: Build logistics-system binary
        run: cargo build --bin logistics-system --release

      # Build the spec-generator helper binary
      - name: Build gen_openapi binary
        run: cargo build --bin gen_openapi --release

      # Generate openapi.json — no MySQL needed, this is pure schema generation
      - name: Generate OpenAPI spec JSON
        run: cargo run --bin gen_openapi --release > openapi.json

      # Validate the spec is well-formed JSON
      - name: Validate OpenAPI JSON is well-formed
        run: |
          python3 -c "
          import json, sys
          with open('openapi.json') as f:
              spec = json.load(f)

          paths = spec.get('paths', {})
          print(f'OpenAPI version : {spec[\"openapi\"]}')
          print(f'Total paths     : {len(paths)}')

          expected = [
              '/api/health',
              '/api/orgs',
              '/api/orgs/{id}',
              '/api/orgs/{id}/location',
              '/api/orgs/{id}/vehicles',
              '/api/orgs/{id}/godowns',
              '/api/godowns/{gid}',
              '/api/godowns/{gid}/location',
              '/api/godowns/{gid}/stock',
              '/api/godowns/{gid}/stock/{desc}',
              '/api/orgs/{id}/dispatch',
              '/api/dispatches/{id}/status',
              '/api/vehicles/{reg}/location',
              '/api/vehicles/{reg}',
              '/api/customers',
              '/api/customers/{id}/location',
          ]

          missing = [p for p in expected if p not in paths]
          if missing:
              print('MISSING paths:', missing, file=sys.stderr)
              sys.exit(1)

          print('All expected API paths are present in the OpenAPI spec ✅')
          "

      # Start the server (no MySQL — it starts fine without it; spec endpoint is static)
      - name: Start logistics-system server (background)
        run: |
          ./target/release/logistics-system &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server to be ready
        run: |
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "Server is ready ✅"
              exit 0
            fi
            echo "Waiting for server... ($i/20)"
            sleep 1
          done
          echo "::error::Server failed to start within 20 seconds"
          exit 1

      - name: Validate /api-docs/openapi.json endpoint returns 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api-docs/openapi.json)
          echo "Response status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "::error::/api-docs/openapi.json returned $STATUS" && exit 1)
          echo "OpenAPI JSON endpoint is reachable ✅"

      - name: Validate Swagger UI HTML is served
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:8080/swagger-ui/)
          echo "Response status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "::error::/swagger-ui/ returned $STATUS" && exit 1)
          echo "Swagger UI endpoint is reachable ✅"

      - name: Verify all expected API paths exist in live spec
        run: |
          python3 -c "
          import json, urllib.request, sys

          with urllib.request.urlopen('http://127.0.0.1:8080/api-docs/openapi.json') as r:
              spec = json.loads(r.read())

          paths = spec.get('paths', {})
          expected = [
              '/api/health',
              '/api/orgs',
              '/api/orgs/{id}',
              '/api/orgs/{id}/location',
              '/api/orgs/{id}/vehicles',
              '/api/orgs/{id}/godowns',
              '/api/godowns/{gid}',
              '/api/godowns/{gid}/location',
              '/api/godowns/{gid}/stock',
              '/api/godowns/{gid}/stock/{desc}',
              '/api/orgs/{id}/dispatch',
              '/api/dispatches/{id}/status',
              '/api/vehicles/{reg}/location',
              '/api/vehicles/{reg}',
              '/api/customers',
              '/api/customers/{id}/location',
          ]

          missing = [p for p in expected if p not in paths]
          if missing:
              print('MISSING paths in live spec:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'All {len(expected)} expected paths verified in live server spec ✅')
          "

      - name: Stop server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

      # Store the generated spec for the deploy job
      - name: Upload openapi.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 1

  # ────────────────────────────────────────────────────────
  # Job 2: Build static Swagger UI site and deploy to Pages
  # ────────────────────────────────────────────────────────
  deploy-pages:
    name: Deploy Swagger UI to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate-swagger
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated openapi.json
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: ./site

      - name: Build static Swagger UI site
        run: |
          cat > ./site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Logistics System API — Swagger UI</title>
            <meta name="description" content="Interactive REST API documentation for the Logistics System built with Rust and Actix-Web." />
            <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
            <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5/favicon-32x32.png" sizes="32x32" />
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
                background: #0f1117;
                min-height: 100vh;
              }
              #header {
                background: linear-gradient(135deg, #1a1d2e 0%, #16213e 50%, #0f3460 100%);
                padding: 24px 32px;
                border-bottom: 1px solid rgba(255,255,255,0.08);
                display: flex;
                align-items: center;
                gap: 16px;
              }
              #header .badge {
                background: linear-gradient(135deg, #e94560, #c0392b);
                color: white;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 1px;
                text-transform: uppercase;
                padding: 4px 10px;
                border-radius: 20px;
              }
              #header h1 {
                color: white;
                font-size: 22px;
                font-weight: 700;
                letter-spacing: -0.3px;
              }
              #header p {
                color: rgba(255,255,255,0.55);
                font-size: 13px;
                margin-top: 4px;
              }
              #swagger-ui { background: #fff; }
              .swagger-ui .topbar { display: none; }
            </style>
          </head>
          <body>
            <div id="header">
              <div>
                <h1>🚚 Logistics System API</h1>
                <p>Rust · Actix-Web · MySQL — Interactive REST API Documentation</p>
              </div>
              <span class="badge">Live Docs</span>
            </div>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
            <script>
              window.onload = () => {
                SwaggerUIBundle({
                  url: './openapi.json',
                  dom_id: '#swagger-ui',
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                  ],
                  layout: 'StandaloneLayout',
                  deepLinking: true,
                  displayRequestDuration: true,
                  defaultModelsExpandDepth: 2,
                  defaultModelExpandDepth: 2,
                  tryItOutEnabled: true,
                  syntaxHighlight: { activated: true, theme: 'monokai' },
                });
              };
            </script>
          </body>
          </html>
          HTMLEOF
          echo "Static Swagger UI site built in ./site/"
          ls -la ./site/

      # NOTE: GitHub Pages must be enabled once manually before this step works:
      #   Repo → Settings → Pages → Build and deployment → Source → GitHub Actions
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
